<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade & Syllabus Tracker</title>
    <style>
        /* --- Clean, Modern Aesthetic Styles --- */
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent-color: #6366f1;
            --danger-color: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success-color: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            padding-bottom: 100px; /* Space for the bottom navigation bar */
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto 30px auto;
        }

        h1 { margin: 0; font-size: 24px; }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-danger { background-color: var(--danger-color); }
        .btn-success { background-color: var(--success-color); }

        /* --- Dashboard Grid --- */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .course-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
        }

        .course-card:hover {
            transform: translateY(-4px);
        }

        /* Target grade warning outline */
        .course-card.warning {
            border-color: var(--danger-color);
        }

        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .delete-btn:hover { color: var(--danger-color); }

        .grade-display {
            font-size: 36px;
            font-weight: bold;
            margin: 15px 0 5px 0;
            color: var(--accent-color);
        }

        .course-card.warning .grade-display {
            color: var(--danger-color);
        }

        /* --- Views Management --- */
        .view { display: none; }
        .view.active { display: block; }

        .detail-container {
            max-width: 700px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
        }

        /* --- Forms & Modals --- */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 10px;
            background-color: #2a2a35;
            border: 1px solid #3f3f46;
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
        }

        /* Inline formatting for the completion checkbox */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            background-color: #2a2a35;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #3f3f46;
        }

        .checkbox-group input {
            width: auto;
            cursor: pointer;
        }

        /* --- Bottom Navigation Bar --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--card-bg);
            padding: 15px 0;
            display: flex;
            justify-content: center;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
        }

        .add-class-trigger {
            font-size: 24px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background-color: var(--accent-color);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.4);
        }

        /* --- Grade List Styling --- */
        .grade-item {
            background: #2a2a35;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .grade-target-text {
            color: var(--success-color);
            font-size: 13px;
            margin-top: 4px;
            font-weight: 500;
        }

        .action-links button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            margin-left: 10px;
            text-decoration: underline;
        }

        .action-links button:hover {
            color: white;
        }

        .action-links button.del-item:hover {
            color: var(--danger-color);
        }

        /* --- Live Goal Editor Layout --- */
        .goal-editor-zone {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
            max-width: 260px;
        }

        .goal-editor-zone input {
            padding: 6px 10px;
        }

        .goal-editor-zone .btn {
            padding: 6px 12px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div id="dashboard-view" class="view active">
        <header>
            <div>
                <h1 id="welcome-text">My Dashboard</h1>
                <p style="color: var(--text-muted); margin: 5px 0 0 0;">Track your semester progress</p>
            </div>
            <button class="btn btn-danger" onclick="resetApp()">Reset App</button>
        </header>

        <div class="dashboard" id="courses-grid">
            </div>

        <div class="bottom-nav">
            <button class="add-class-trigger" onclick="switchView('add-course-view')">+</button>
        </div>
    </div>

    <div id="add-course-view" class="view">
        <div class="detail-container">
            <h2>Add New Course</h2>
            <div class="form-group">
                <label>Course Name</label>
                <input type="text" id="new-course-name" placeholder="e.g., Grade 10 Math">
            </div>
            <div class="form-group">
                <label>Grade Goal (%)</label>
                <input type="number" id="new-course-goal" placeholder="e.g., 85">
            </div>
            <button class="btn" onclick="addNewCourse()">Save Course</button>
            <button class="btn btn-danger" onclick="switchView('dashboard-view')">Cancel</button>
        </div>
    </div>

    <div id="detail-view" class="view">
        <div class="detail-container">
            <button class="btn" onclick="switchView('dashboard-view')" style="margin-bottom: 20px;">&lt;- Back to Dashboard</button>
            <h2 id="detail-course-title" style="margin-bottom: 5px;">Course Title</h2>
            
            <label style="margin-bottom: 2px;">Target Grade Goal (%)</label>
            <div class="goal-editor-zone">
                <input type="number" id="detail-course-goal-input" placeholder="Goal">
                <button class="btn btn-success" onclick="updateCourseGoal()">Update Goal</button>
            </div>

            <hr style="border-color: #3f3f46; margin: 20px 0;">

            <h3 id="form-action-title">Add an Assignment / Task</h3>
            
            <div class="checkbox-group">
                <input type="checkbox" id="grade-completed" checked onchange="toggleScoreInput(this)">
                <label for="grade-completed" style="margin: 0; cursor: pointer; color: white;">I have completed this assignment</label>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
                <input type="text" id="grade-name" placeholder="Assignment Name">
                <select id="grade-type">
                    <option value="Test">Test</option>
                    <option value="Quiz">Quiz</option>
                    <option value="Project">Project</option>
                    <option value="Exam">Exam</option>
                </select>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
                <input type="number" id="grade-weight" placeholder="Weight/Worth (%)">
                <input type="number" id="grade-score" placeholder="Grade Achieved (%)">
            </div>
            <button class="btn" id="submit-grade-btn" onclick="addGradeToCourse()">Add Assignment Entry</button>
            <button class="btn btn-danger" id="cancel-edit-btn" onclick="clearGradeForm()" style="display: none;">Cancel Edit</button>

            <hr style="border-color: #3f3f46; margin: 20px 0;">

            <h3>Graded & Planned Items</h3>
            <div id="grades-list-container">
                </div>
        </div>
    </div>

    <script>
        let appData = {
            userName: "",
            courses: []
        };

        let activeCourseIndex = null;
        let editingGradeIndex = null; 

        window.onload = function() {
            const savedData = localStorage.getItem('gradeTrackerData');
            if (savedData) {
                appData = JSON.parse(savedData);
            } else {
                let name = prompt("Welcome! What is your name?");
                appData.userName = name ? name : "Student";
                saveToLocalStorage();
            }
            document.getElementById('welcome-text').innerText = `Hello, ${appData.userName}`;
            renderDashboard();
        };

        function saveToLocalStorage() {
            localStorage.setItem('gradeTrackerData', JSON.stringify(appData));
        }

        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            clearGradeForm();
        }

        function toggleScoreInput(checkbox) {
            const scoreInput = document.getElementById('grade-score');
            if (!checkbox.checked) {
                scoreInput.value = '';
                scoreInput.disabled = true;
                scoreInput.style.opacity = '0.4';
                scoreInput.placeholder = "Calculated automatically";
            } else {
                scoreInput.disabled = false;
                scoreInput.style.opacity = '1';
                scoreInput.placeholder = "Grade Achieved (%)";
            }
        }

        function renderDashboard() {
            const grid = document.getElementById('courses-grid');
            grid.innerHTML = ''; 

            appData.courses.forEach((course, index) => {
                const currentGrade = calculateCourseGrade(course);
                const isBelowGoal = currentGrade !== '--' && currentGrade < course.goal;

                const card = document.createElement('div');
                card.className = `course-card ${isBelowGoal ? 'warning' : ''}`;
                card.setAttribute('onclick', `openCourseDetail(${index})`);

                card.innerHTML = `
                    <button class="delete-btn" onclick="deleteCourse(event, ${index})">×</button>
                    <h3 style="margin: 0;">${course.name}</h3>
                    <div class="grade-display">${currentGrade}${currentGrade === '--' ? '%' : '%'}</div>
                    <p style="margin: 0; font-size: 12px; color: var(--text-muted)">
                        Goal: ${course.goal}% ${currentGrade === '--' ? '' : (isBelowGoal ? '⚠️ Below Goal' : '✨ Tracking Well')}
                    </p>
                `;
                grid.appendChild(card);
            });
        }

        function addNewCourse() {
            const nameInput = document.getElementById('new-course-name');
            const goalInput = document.getElementById('new-course-goal');

            if (!nameInput.value || !goalInput.value) {
                alert("Please fill in all fields.");
                return;
            }

            const newCourse = {
                name: nameInput.value,
                goal: parseFloat(goalInput.value),
                grades: []
            };

            appData.courses.push(newCourse);
            saveToLocalStorage();
            renderDashboard();

            nameInput.value = '';
            goalInput.value = '';
            switchView('dashboard-view');
        }

        function updateCourseGoal() {
            const goalInput = document.getElementById('detail-course-goal-input');
            const newGoalValue = parseFloat(goalInput.value);

            if (isNaN(newGoalValue) || newGoalValue < 0) {
                alert("Please enter a valid numeric goal percentage.");
                return;
            }

            // Save new target limit setting to currently active course index
            appData.courses[activeCourseIndex].goal = newGoalValue;
            saveToLocalStorage();
            
            // Re-render everything with the new goal math rule
            renderGradesList();
            renderDashboard();
            alert("Goal updated successfully!");
        }

        function deleteCourse(event, index) {
            event.stopPropagation(); 
            if(confirm("Are you sure you want to delete this course? All data inside will be wiped out.")) {
                appData.courses.splice(index, 1);
                saveToLocalStorage();
                renderDashboard();
            }
        }

        function calculateCourseGrade(course) {
            const completedGrades = course.grades.filter(g => g.completed);
            if (completedGrades.length === 0) return '--';

            let totalWeightedScores = 0;
            let totalWeightEncountered = 0;

            completedGrades.forEach(g => {
                totalWeightedScores += (g.score * (g.weight / 100));
                totalWeightEncountered += g.weight;
            });

            if (totalWeightEncountered === 0) return '--';
            return Math.round((totalWeightedScores / (totalWeightEncountered / 100)));
        }

        function calculateTargetNeeded(course, targetWeight) {
            let pointsEarnedSoFar = 0;
            let totalWeightUsed = 0;

            course.grades.forEach(g => {
                if (g.completed) {
                    pointsEarnedSoFar += (g.score * (g.weight / 100));
                    totalWeightUsed += g.weight;
                }
            });

            let pointsNeededForGoal = course.goal - pointsEarnedSoFar;

            if (pointsNeededForGoal <= 0) return 0;

            let remainingWeightInCourse = 100 - totalWeightUsed;

            if (remainingWeightInCourse <= 0) return 100;

            let requiredAverageForRemainingWork = (pointsNeededForGoal / remainingWeightInCourse) * 100;

            let finalTarget = Math.ceil(requiredAverageForRemainingWork);
            
            if (finalTarget > 100) return 100;
            if (finalTarget < 0) return 0;
            
            return finalTarget;
        }

        function openCourseDetail(index) {
            activeCourseIndex = index;
            const course = appData.courses[index];

            document.getElementById('detail-course-title').innerText = course.name;
            document.getElementById('detail-course-goal-input').value = course.goal;
            
            renderGradesList();
            switchView('detail-view');
        }

        function renderGradesList() {
            const container = document.getElementById('grades-list-container');
            container.innerHTML = '';
            const course = appData.courses[activeCourseIndex];

            if(course.grades.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted)">No assignments added yet.</p>';
                return;
            }

            course.grades.forEach((g, idx) => {
                const item = document.createElement('div');
                item.className = "grade-item";
                
                if (g.completed) {
                    item.innerHTML = `
                        <div>
                            <strong>${g.name}</strong> <span style="color:var(--text-muted); font-size:12px;">(${g.type})</span>
                            <br><small style="color:var(--text-muted)">Weight: ${g.weight}%</small>
                        </div>
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <div style="font-weight:bold; color:var(--accent-color)">${g.score}%</div>
                            <div class="action-links">
                                <button onclick="editGradeItem(${idx})">Edit</button>
                                <button class="del-item" onclick="deleteGradeItem(${idx})">Remove</button>
                            </div>
                        </div>
                    `;
                } else {
                    const requiredTarget = calculateTargetNeeded(course, g.weight);
                    item.innerHTML = `
                        <div>
                            <strong style="color: var(--text-muted);">${g.name} (Upcoming)</strong> 
                            <span style="color:var(--text-muted); font-size:12px;">(${g.type})</span>
                            <br><small style="color:var(--text-muted)">Weight: ${g.weight}%</small>
                            <div class="grade-target-text">🎯 Aim for: ${requiredTarget}% on remaining work to reach goal</div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <div style="font-weight:bold; color:var(--text-muted)">Pending</div>
                            <div class="action-links">
                                <button onclick="editGradeItem(${idx})">Edit</button>
                                <button class="del-item" onclick="deleteGradeItem(${idx})">Remove</button>
                            </div>
                        </div>
                    `;
                }
                container.appendChild(item);
            });
        }

        function addGradeToCourse() {
            const isCompleted = document.getElementById('grade-completed').checked;
            const name = document.getElementById('grade-name').value;
            const type = document.getElementById('grade-type').value;
            const weight = parseFloat(document.getElementById('grade-weight').value);
            let score = parseFloat(document.getElementById('grade-score').value);

            if (!name || isNaN(weight)) {
                alert("Please give your assignment a name and weight value.");
                return;
            }

            if (isCompleted && isNaN(score)) {
                alert("Please enter the grade score you achieved.");
                return;
            }

            if (!isCompleted) {
                score = 0; 
            }

            const gradeObject = { name, type, weight, score, completed: isCompleted };

            if (editingGradeIndex !== null) {
                appData.courses[activeCourseIndex].grades[editingGradeIndex] = gradeObject;
                editingGradeIndex = null;
            } else {
                appData.courses[activeCourseIndex].grades.push(gradeObject);
            }

            saveToLocalStorage();
            renderGradesList();
            renderDashboard(); 
            clearGradeForm();
        }

        function editGradeItem(idx) {
            editingGradeIndex = idx;
            const grade = appData.courses[activeCourseIndex].grades[idx];

            document.getElementById('form-action-title').innerText = "Edit Assignment / Task";
            document.getElementById('submit-grade-btn').innerText = "Update Assignment";
            document.getElementById('cancel-edit-btn').style.display = "inline-block";

            document.getElementById('grade-name').value = grade.name;
            document.getElementById('grade-type').value = grade.type;
            document.getElementById('grade-weight').value = grade.weight;
            
            document.getElementById('grade-completed').checked = grade.completed;
            toggleScoreInput(document.getElementById('grade-completed'));
            
            if (grade.completed) {
                document.getElementById('grade-score').value = grade.score;
            }
        }

        function deleteGradeItem(idx) {
            if(confirm("Remove this item entry from the course timeline?")) {
                appData.courses[activeCourseIndex].grades.splice(idx, 1);
                saveToLocalStorage();
                renderGradesList();
                renderDashboard(); 
            }
        }

        function clearGradeForm() {
            editingGradeIndex = null;
            document.getElementById('form-action-title').innerText = "Add an Assignment / Task";
            document.getElementById('submit-grade-btn').innerText = "Add Assignment Entry";
            document.getElementById('cancel-edit-btn').style.display = "none";

            document.getElementById('grade-name').value = '';
            document.getElementById('grade-weight').value = '';
            document.getElementById('grade-score').value = '';
            document.getElementById('grade-completed').checked = true;
            toggleScoreInput(document.getElementById('grade-completed'));
        }

        function resetApp() {
            if(confirm("Reset everything? All your classes and recorded grades will be permanently deleted.")) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
